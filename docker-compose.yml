# Local production-like stack: API + Java A2A agent + Qdrant + Postgres + OpenTelemetry Collector + Jaeger + Prometheus.
#   cp .env.example .env   # add at least one LLM provider key
#   docker compose up --build
# API http://localhost:8000/docs · Jaeger http://localhost:16686 · Prometheus http://localhost:9090
# Every published port is bound to 127.0.0.1: nothing (least of all Postgres with dev
# credentials) is reachable from other machines on the network. Images are pinned by digest.
services:
  api:
    build:
      context: .
    env_file: .env
    environment:
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      CHECKPOINTER_BACKEND: postgres
      POSTGRES_URL: postgresql://agency:agency@postgres:5432/agency
      # Audit trail, reviews, consents, CRM and campaigns (same Postgres, own tables).
      DATABASE_URL: postgresql+psycopg://agency:agency@postgres:5432/agency
      DB_AUTO_MIGRATE: "true"  # local only; Kubernetes migrates in an init container
      REMOTE_AGENTS: '["http://jvm-agent:8080"]'
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      jvm-agent:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]

  # Remote specialist in Java/Spring Boot, spoken to over A2A. Rule-based by default;
  # AGENT_LLM_PROVIDER=anthropic (+ ANTHROPIC_API_KEY in .env) switches on Spring AI.
  jvm-agent:
    build:
      context: ./agents/jvm-specialist
    environment:
      AGENT_PUBLIC_URL: http://jvm-agent:8080
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped

  # Conversation checkpoints (LangGraph). Dev credentials only.
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: agency
      POSTGRES_DB: agency
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency -d agency"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: [./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    ports: ["127.0.0.1:16686:16686"]

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]

volumes:
  qdrant-data:
  postgres-data:
