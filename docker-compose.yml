# Local production-like stack: API + Java A2A agent + Qdrant + Postgres + OpenTelemetry Collector + Jaeger + Prometheus.
#   cp .env.example .env   # add at least one LLM provider key
#   docker compose up --build
# API http://localhost:8000/docs · Jaeger http://localhost:16686 · Prometheus http://localhost:9090
# Every published port is bound to 127.0.0.1: nothing (least of all Postgres with dev
# credentials) is reachable from other machines on the network. Images are pinned by digest.
services:
  api:
    build:
      context: .
    env_file: .env
    environment:
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      CHECKPOINTER_BACKEND: postgres
      POSTGRES_URL: postgresql://agency:agency@postgres:5432/agency
      # Audit trail, reviews, consents, CRM and campaigns (same Postgres, own tables).
      DATABASE_URL: postgresql+psycopg://agency:agency@postgres:5432/agency
      REMOTE_AGENTS: '["http://jvm-agent:8080"]'
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      jvm-agent:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.4@sha256:318c11b72aaab96b36e9662ad244de3cabd0653a1b942d4e8191f18296c81af0
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]

  # Remote specialist in Java/Spring Boot, spoken to over A2A. Rule-based by default;
  # AGENT_LLM_PROVIDER=anthropic (+ ANTHROPIC_API_KEY in .env) switches on Spring AI.
  jvm-agent:
    build:
      context: ./agents/jvm-specialist
    environment:
      AGENT_PUBLIC_URL: http://jvm-agent:8080
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped

  # Conversation checkpoints (LangGraph). Dev credentials only.
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: agency
      POSTGRES_DB: agency
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency -d agency"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0@sha256:3f6274fe609da4f9964fbc2ef36b83d08d47964fbb11629251393590d3924072
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: [./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/jaeger:2.2.0@sha256:1dedb5660e77c8505ca2a40eeca957feabaaebeccf7bcf583965326176abc40d
    ports: ["127.0.0.1:16686:16686"]

  prometheus:
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]

volumes:
  qdrant-data:
  postgres-data:
