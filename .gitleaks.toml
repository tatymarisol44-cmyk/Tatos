# Gitleaks configuration (CI scans the whole git history, .github/workflows/ci.yml).
# Every default rule applies. The allowlist below covers only synthetic passwords typed in
# the staff sign-in tests (ADR 0024): they open nothing, and are allowed only in those
# files and only as these exact values. A real secret anywhere is still a finding.
[extend]
useDefault = true

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic passwords in the staff sign-in tests (ADR 0024)"
condition = "AND"
paths = ['''^tests/test_(staff_login|tenant_isolation_matrix)\.py$''']
regexTarget = "secret"
regexes = [
  '''^(?:Cuaderno-Azul-2026|Otro-Cuaderno-2027|ana\.perez-2026x|adivinanza-123|otra-cosa-123|no-es-esta-1)$''',
]

# Exact false positives reviewed and explicitly approved by the user on 2026-10-20.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic enrollment password in audit concurrency test"
condition = "AND"
paths = ['''^tests/test_audit_auth_concurrency\.py$''']
regexTarget = "secret"
regexes = ['''^Cuaderno-Azul-2026$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Four verified source file SHA-256 digests in the audit manifest"
condition = "AND"
paths = ['''^docs/evidence/saas-audit-2026-10-19/final-start-manifest\.json$''']
regexTarget = "secret"
regexes = ['''^(?:9ecd9b9118f446007c9cac789f4e0af566b1106d30ab038a1d9ccfb5c86a99dc|594e5bf9929a9a39b8c83f0a2bb70b38421a62acdc1e2ec94e3efe2d5ab77980|27917eaa7abc82342bb94f732662ede3d58b2749f77b79f16ff3b58989ce3214|ee498e1c00e1de5655a3cef34cc178d1ba866c2b141c03c338b6a6039d7fc590)$''']

# Exact additional evidence digest approved by the user on 2026-10-20.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Verified Render release evidence file SHA-256"
condition = "AND"
paths = ['''^docs/evidence/render-release-2026-10-20/manifest\.json$''']
regexTarget = "secret"
regexes = ['''^bc2fa63cb5ba2122741b03d9c636a867962ff31df4fada22b36a073d655519eb$''']
