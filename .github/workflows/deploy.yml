name: Deploy

# Continuous delivery (audit 2026-10-08): main -> CI (test, scan, SBOM, sign) -> kind
# rehearsal -> staging -> human approval -> production, always the SAME image digest.
# - rehearsal: the real manifests on a throwaway kind cluster with deploy/scripts/rollout.sh,
#   then a broken image on purpose, which must be rolled back while old pods keep serving.
# - staging, production: GKE, keyless (Workload Identity Federation: no key or kubeconfig
#   stored in GitHub), in deploy-gke.yml. Each runs only if its environment's variables
#   are set, so the pipeline is green before the cloud exists. The image signature is
#   verified before deploying. `production` waits for the environment's required reviewers.
# - single-node: the MVP production profile (ADR 0021) installed with the real
#   deploy/single-node/install.sh on the runner, every demo flow walked against it, a
#   nightly backup taken and checked, a restart that keeps the data, and a broken
#   release refused while the running one keeps serving.
# - workflow_dispatch: redeploy (or roll back to) a given digest, through staging first.
#
# Where production is: repository variable DEPLOY_TARGET (Settings -> Secrets and
# variables -> Actions -> Variables). Unset: nothing past the rehearsals runs, so no
# approval is ever requested for a cloud that does not exist yet.
#   DEPLOY_TARGET=vm   production-vm: the single-node server, over SSH. Environment
#                      `production`: vars VM_HOST, VM_USER (sudo), VM_DIR (/opt/agency);
#                      secrets VM_SSH_KEY (private key), VM_KNOWN_HOSTS (ssh-keyscan line).
#   DEPLOY_TARGET=gke  staging then production on GKE (deploy-gke.yml), as below.
#
# Per-environment variables for GKE (Settings -> Environments -> staging / production):
#   GCP_WIF_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/github/providers/github
#   GCP_DEPLOYER_SA   deployer@<project>.iam.gserviceaccount.com (roles/container.developer)
#   GKE_CLUSTER, GKE_LOCATION, GCP_PROJECT
#   AR_REPOSITORY     <region>-docker.pkg.dev/<project>/images (decision O4)
#   BINAUTHZ_ATTESTOR, BINAUTHZ_KEY_VERSION  (decision O6)
# All of them are `terraform output` values (deploy/terraform).
# Secret: SMOKE_API_KEY (a service key of a smoke-test tenant with no real data).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      digest:
        description: "API image digest to deploy (sha256:...), e.g. to roll back"
        required: true
      jvm_digest:
        description: "Java agent digest (sha256:...); default: the one built from main's head"
        required: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      api: ${{ steps.digest.outputs.api }}
      jvm: ${{ steps.digest.outputs.jvm }}
      sha: ${{ steps.digest.outputs.sha }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: digest
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/agency-orchestrator
          JVM_REPO: ghcr.io/${{ github.repository_owner }}/agency-orchestrator-jvm-agent
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          INPUT_DIGEST: ${{ inputs.digest }}
          INPUT_JVM_DIGEST: ${{ inputs.jvm_digest }}
        run: |
          resolve() {  # <repo> <given digest or empty>
            local digest="$2"
            if [ -z "$digest" ]; then
              digest=$(docker buildx imagetools inspect "$1:sha-${HEAD_SHA:0:7}" \
                --format '{{json .Manifest}}' | jq -r .digest)
            fi
            case "$digest" in sha256:*) ;; *) echo "::error::no digest for $1 ($digest)" >&2; exit 1 ;; esac
            echo "$1@$digest"
          }
          api=$(resolve "$REPO" "$INPUT_DIGEST")
          jvm=$(resolve "$JVM_REPO" "$INPUT_JVM_DIGEST")
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "jvm=$jvm" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "deploying $api and $jvm"

  rehearsal:
    needs: resolve
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMOKE_API_KEY: ci-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: rehearsal
      - name: Build the image and load it into kind
        run: |
          docker build -t agency-orchestrator:ci .
          kind load docker-image agency-orchestrator:ci --name rehearsal
      - name: First deploy (schema migrated by the init container)
        run: |
          kubectl apply -k deploy/k8s/overlays/ci
          kubectl -n agency rollout status deploy/postgres --timeout=180s
          kubectl -n agency rollout status statefulset/qdrant --timeout=180s
          kubectl -n agency rollout status deploy/redis --timeout=180s
          bash deploy/scripts/rollout.sh agency agency-orchestrator:ci 300s
      - name: Broken release is rolled back, service stays up
        run: |
          set +e
          bash deploy/scripts/rollout.sh agency agency-orchestrator:does-not-exist 90s
          code=$?
          set -e
          test "$code" -eq 1 || { echo "a broken release must fail the deploy"; exit 1; }
          image=$(kubectl -n agency get deploy/agency-orchestrator \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          test "$image" = "agency-orchestrator:ci" || { echo "not rolled back: $image"; exit 1; }
          kubectl -n agency rollout status deploy/agency-orchestrator --timeout=120s
      - name: Diagnostics
        if: failure()
        run: |
          bash deploy/scripts/diagnose.sh agency
          kubectl -n agency describe deploy/agency-orchestrator
          kubectl -n agency logs deploy/agency-orchestrator --all-containers --tail=200 || true

  single-node:
    needs: resolve
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      API: ${{ needs.resolve.outputs.api }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install with the real installer (image signed by CI is verified)
        run: |
          echo "D=$RUNNER_TEMP/agency" >> "$GITHUB_ENV"
          sudo bash deploy/single-node/install.sh --dir "$RUNNER_TEMP/agency" \
            --image "$API" --tenant rehearsal --no-tunnel --no-timer
      - name: Every demo flow against the installed stack
        run: |
          cd "$D"
          key=$(sudo sed -n 's/^API_KEYS=//p' .env | cut -d, -f1 | cut -d: -f1)
          meta=$(sudo sed -n 's/^META_APP_SECRET=//p' .env)
          sudo docker compose exec -T api agency demo --url http://127.0.0.1:8000 \
            --key "$key" --meta-app-secret "$meta"
      - name: Nightly backup, then its checksum
        run: |
          sudo "$D/backup.sh"
          # backups/ is root-only (mode 700): check it as root.
          sudo bash -c 'cd "$1/backups" && sha256sum -c ./*.sha256 && test -s "$(ls ./*.anchors.jsonl | head -1)"' _ "$D"
      - name: A full restart keeps the data
        run: |
          cd "$D"
          key=$(sudo sed -n 's/^API_KEYS=//p' .env | cut -d, -f1 | cut -d: -f1)
          count() { curl -fsS -H "X-API-Key: $key" http://127.0.0.1:8000/v1/crm/patients | jq length; }
          before=$(count)
          sudo docker compose down
          sudo ./deploy.sh "$API"
          after=$(count)
          echo "patients before: $before, after: $after"
          test "$before" -gt 0 && test "$before" = "$after"
      - name: Broken releases are refused, the running one keeps serving
        run: |
          cd "$D"
          bad="${API%@*}@sha256:$(printf '0%.0s' $(seq 64))"
          set +e
          sudo ./deploy.sh "$bad" 60; signed=$?
          sudo env VERIFY_SIGNATURE=0 ./deploy.sh "$bad" 60; missing=$?
          set -e
          test "$signed" -eq 1 && test "$missing" -eq 1
          sudo grep -qx "API_IMAGE=$API" .env
          curl -fsS http://127.0.0.1:8000/readyz
      - name: Diagnostics
        if: failure()
        run: |
          cd "$D" || exit 0
          # API_IMAGE may be empty after a failed first install: give Compose one.
          dc() { sudo env API_IMAGE="$API" docker compose "$@"; }
          dc ps -a
          for svc in api postgres qdrant redis; do
            log="$(dc logs --no-color --tail 40 "$svc" 2>&1 || true)"
            log="${log//'%'/'%25'}"; log="${log//$'\r'/'%0D'}"
            echo "::error title=single-node $svc::${log//$'\n'/'%0A'}"
          done

  production-vm:
    needs: [resolve, single-node]
    if: vars.DEPLOY_TARGET == 'vm'
    runs-on: ubuntu-latest
    environment: production # required reviewers approve here
    timeout-minutes: 20
    env:
      API: ${{ needs.resolve.outputs.api }}
      VM: ${{ vars.VM_USER }}@${{ vars.VM_HOST }}
      VM_DIR: ${{ vars.VM_DIR || '/opt/agency' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: SSH identity (host key pinned, never trust-on-first-use)
        env:
          KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Ship this commit's stack files, then the health-gated deploy
        run: |
          ssh_vm() { ssh -i ~/.ssh/id -o StrictHostKeyChecking=yes -o BatchMode=yes "$VM" "$@"; }
          cd deploy/single-node
          scp -i ~/.ssh/id -o StrictHostKeyChecking=yes -o BatchMode=yes \
            compose.yaml deploy.sh backup.sh "$VM:/tmp/"
          ssh_vm "sudo install -m 0644 /tmp/compose.yaml $VM_DIR/" \
            "&& sudo install -m 0755 /tmp/deploy.sh /tmp/backup.sh $VM_DIR/" \
            "&& sudo $VM_DIR/deploy.sh '$API'"

  staging:
    needs: [resolve, rehearsal]
    # A manual redeploy skips the rehearsal (that image already passed it), never staging.
    if: >-
      always() && vars.DEPLOY_TARGET == 'gke' && needs.resolve.result == 'success' &&
      (needs.rehearsal.result == 'success' || needs.rehearsal.result == 'skipped')
    uses: ./.github/workflows/deploy-gke.yml
    with:
      environment: staging
      image: ${{ needs.resolve.outputs.api }}
      jvm_image: ${{ needs.resolve.outputs.jvm }}
      ref: ${{ needs.resolve.outputs.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: read  # crane copies the images from GHCR into Artifact Registry
      id-token: write

  production:
    needs: [resolve, staging]
    if: vars.DEPLOY_TARGET == 'gke'
    uses: ./.github/workflows/deploy-gke.yml
    with:
      environment: production
      image: ${{ needs.resolve.outputs.api }}
      jvm_image: ${{ needs.resolve.outputs.jvm }}
      ref: ${{ needs.resolve.outputs.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: read  # crane copies the images from GHCR into Artifact Registry
      id-token: write
