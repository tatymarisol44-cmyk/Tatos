name: Deploy

# Continuous delivery (audit 2026-10-08): main -> CI (test, scan, SBOM, sign) -> kind
# rehearsal -> staging -> human approval -> production, always the SAME image digest.
# - rehearsal: the real manifests on a throwaway kind cluster with deploy/scripts/rollout.sh,
#   then a broken image on purpose, which must be rolled back while old pods keep serving.
# - staging, production: GKE, keyless (Workload Identity Federation: no key or kubeconfig
#   stored in GitHub), in deploy-gke.yml. Each runs only if its environment's variables
#   are set, so the pipeline is green before the cloud exists. The image signature is
#   verified before deploying. `production` waits for the environment's required reviewers.
# - workflow_dispatch: redeploy (or roll back to) a given digest, through staging first.
#
# Per-environment variables (Settings -> Environments -> staging / production):
#   GCP_WIF_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/github/providers/github
#   GCP_DEPLOYER_SA   deployer@<project>.iam.gserviceaccount.com (roles/container.developer)
#   GKE_CLUSTER, GKE_LOCATION, GCP_PROJECT
# Secret: SMOKE_API_KEY (a service key of a smoke-test tenant with no real data).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      digest:
        description: "API image digest to deploy (sha256:...), e.g. to roll back"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      api: ${{ steps.digest.outputs.api }}
      sha: ${{ steps.digest.outputs.sha }}
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: digest
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/agency-orchestrator
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          INPUT_DIGEST: ${{ inputs.digest }}
        run: |
          if [ -n "$INPUT_DIGEST" ]; then
            digest="$INPUT_DIGEST"
          else
            digest=$(docker buildx imagetools inspect "$REPO:sha-${HEAD_SHA:0:7}" \
              --format '{{json .Manifest}}' | jq -r .digest)
          fi
          case "$digest" in sha256:*) ;; *) echo "::error::no digest ($digest)"; exit 1 ;; esac
          echo "api=$REPO@$digest" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "deploying $REPO@$digest"

  rehearsal:
    needs: resolve
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMOKE_API_KEY: ci-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: rehearsal
      - name: Build the image and load it into kind
        run: |
          docker build -t agency-orchestrator:ci .
          kind load docker-image agency-orchestrator:ci --name rehearsal
      - name: First deploy (schema migrated by the init container)
        run: |
          kubectl apply -k deploy/k8s/overlays/ci
          kubectl -n agency rollout status deploy/postgres --timeout=180s
          kubectl -n agency rollout status statefulset/qdrant --timeout=180s
          kubectl -n agency rollout status deploy/redis --timeout=180s
          bash deploy/scripts/rollout.sh agency agency-orchestrator:ci 300s
      - name: Broken release is rolled back, service stays up
        run: |
          set +e
          bash deploy/scripts/rollout.sh agency agency-orchestrator:does-not-exist 90s
          code=$?
          set -e
          test "$code" -eq 1 || { echo "a broken release must fail the deploy"; exit 1; }
          image=$(kubectl -n agency get deploy/agency-orchestrator \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          test "$image" = "agency-orchestrator:ci" || { echo "not rolled back: $image"; exit 1; }
          kubectl -n agency rollout status deploy/agency-orchestrator --timeout=120s
      - name: Diagnostics
        if: failure()
        run: |
          bash deploy/scripts/diagnose.sh agency
          kubectl -n agency describe deploy/agency-orchestrator
          kubectl -n agency logs deploy/agency-orchestrator --all-containers --tail=200 || true

  staging:
    needs: [resolve, rehearsal]
    # A manual redeploy skips the rehearsal (that image already passed it), never staging.
    if: >-
      always() && needs.resolve.result == 'success' &&
      (needs.rehearsal.result == 'success' || needs.rehearsal.result == 'skipped')
    uses: ./.github/workflows/deploy-gke.yml
    with:
      environment: staging
      image: ${{ needs.resolve.outputs.api }}
      ref: ${{ needs.resolve.outputs.sha }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  production:
    needs: [resolve, staging]
    uses: ./.github/workflows/deploy-gke.yml
    with:
      environment: production
      image: ${{ needs.resolve.outputs.api }}
      ref: ${{ needs.resolve.outputs.sha }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
