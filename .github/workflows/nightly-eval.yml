name: Nightly eval (real models)

# Measures production quality with real models:
#   1. routing (LLM router + hosted embeddings)
#   2. judge calibration: the LLM judge must agree with human labels before we trust it
#   3. answer quality: end-to-end answers (single, team, RAG) graded by that judge
# Requires repository secrets ANTHROPIC_API_KEY and OPENAI_API_KEY.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    # Real models cost money and need the two secrets above, so the schedule is opt-in:
    # set the repository variable NIGHTLY_EVAL=enabled once the keys exist. A manual run
    # (workflow_dispatch) always works.
    if: github.event_name == 'workflow_dispatch' || vars.NIGHTLY_EVAL == 'enabled'
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
      LLM_BACKEND: litellm
      ROUTER_USE_LLM: "true"
      EMBEDDING_BACKEND: litellm
      ROUTER_TOP_K: "10"
      # Deterministic specialists, so nightly scores are comparable run to run
      # (the router, planner and judge already run at temperature 0).
      LLM_TEMPERATURE: "0"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run agency eval --min-top1 0.80 --min-recall 0.95 --output eval-report.json
      - name: Judge calibration
        id: judge
        if: always()
        run: uv run agency eval-judge --min-agreement 0.85 --max-false-pass 1 --output judge-report.json
      # Independent of the routing gate, but only meaningful with a calibrated judge.
      - name: Answer quality
        if: always() && steps.judge.outcome == 'success'
        run: uv run agency eval-answers --min-pass-rate 0.80 --min-mean 4.0 --output answers-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nightly-eval-report
          path: |
            eval-report.json
            judge-report.json
            answers-report.json
