name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check . --output-format github
      - run: uv run mypy

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: agency
          POSTGRES_PASSWORD: agency
          POSTGRES_DB: agency
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agency -d agency"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Enables the Postgres tests: checkpointer, business flow, concurrency across two
      # replicas (tests/test_postgres_concurrency.py).
      TEST_POSTGRES_URL: postgresql://agency:agency@localhost:5432/agency
      # Sessions in a non-UTC zone, like many managed databases: this once broke the
      # audit-chain hashes (timestamps came back as -05:00).
      PGTZ: America/Guayaquil
      # pg_dump/pg_restore 17 (the server's major) for the backup/restore drill.
      PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync
      - name: Postgres 17 client tools (backup/restore drill)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      # Chromium for the console's browser test (tests/test_console_e2e.py).
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest --junitxml=junit.xml --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results-py${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml

  eval:
    name: Routing eval gate
    runs-on: ubuntu-latest
    env:
      # Offline & deterministic: lexical retrieval only. This is a regression gate on
      # the index/catalog, not a measure of production quality (see nightly-eval.yml).
      LLM_BACKEND: fake
      ROUTER_USE_LLM: "false"
      EMBEDDING_BACKEND: hashing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run agency eval --min-top1 0.50 --min-recall 0.80 --output eval-report.json
      # Answer-eval smoke test: validates the dataset, that pinned agents still exist in
      # the catalog and that no row is blocked or errors. The fake judge passes everything,
      # so quality itself is gated nightly with real models.
      - run: uv run agency eval-answers --min-pass-rate 1.0 --output answers-report.json
      - name: Publish summary
        if: always()
        run: |
          echo '### Routing eval (offline)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python -c "import json;d=json.load(open('eval-report.json'));d.pop('failures');print(json.dumps(d,indent=2))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: eval-report
          path: eval-report.json

  java-agent:
    name: Java A2A agent (tests + live contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and unit/protocol tests
        working-directory: agents/jvm-specialist
        run: ./mvnw -B verify
      - name: Start the agent
        working-directory: agents/jvm-specialist
        run: |
          java -jar target/jvm-specialist-agent.jar > agent.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health/readiness && exit 0
            sleep 1
          done
          cat agent.log; exit 1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync
      # The Python orchestrator discovers the Java agent, routes to it and parses its replies.
      - name: Python <-> Java contract test
        env:
          TEST_A2A_AGENT_URL: http://localhost:8080
        run: uv run pytest tests/test_remote_live.py --no-cov -v

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # gitleaks reads every commit, not just the tree
      # A secret removed in a later commit is still in the history (and in every clone).
      - name: Gitleaks (whole git history)
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
      # Trivy resolves the Java agent's POMs; fetching them from Maven Central at scan time
      # hits its rate limit (429) and aborts the scan, even for POMs Maven itself never
      # needs. So: resolve the dependencies first (cached), then scan offline from that
      # cache (TRIVY_OFFLINE_SCAN below; the vulnerability database still updates).
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Resolve the Java agent's dependencies for the scanner
        working-directory: agents/jvm-specialist
        run: ./mvnw -B -q dependency:go-offline
      - name: Trivy (dependencies, secrets, IaC misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: "true"
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: kustomize build + kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          # Gateway API kinds (gke overlay) are CRDs: their schemas come from the public catalog.
          for overlay in deploy/k8s/base deploy/k8s/overlays/dev deploy/k8s/overlays/ci deploy/k8s/overlays/gke; do
            kubectl kustomize "$overlay" | ./kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
          done
      - name: Terraform (fmt + validate, no cloud access)
        working-directory: deploy/terraform
        run: |
          curl -sSLo tf.zip https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip
          echo "2bc2fcfff033265c9e02ca0351f01794eb122f62a9b2a49a3294b9e49eaab5e4  tf.zip" | sha256sum -c -
          unzip -q tf.zip terraform && rm tf.zip
          ./terraform fmt -check -recursive
          ./terraform init -backend=false -input=false
          ./terraform validate
      - name: Alerting rules (promtool check + unit tests)
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/rules:ro" --entrypoint sh             prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218             -c "promtool check rules /rules/alerts.yml && cd /rules && promtool test rules alerts_test.yml"

  # Build -> scan -> push: an image that fails the scan never reaches the registry. The
  # first build loads the image into the runner's Docker (no attestations: the local store
  # cannot hold them); the push rebuilds from the same layer cache, adding SBOM/provenance.
  image:
    name: Build, scan and push images
    needs: [quality, test, eval, java-agent, security, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless signing: cosign gets a short-lived certificate via OIDC
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    outputs:
      api-digest: ${{ steps.push-api.outputs.digest }}
      jvm-digest: ${{ steps.push-jvm.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Image names match deploy/k8s/base/kustomization.yaml, whatever the repository is
      # called (registry names must be lower-case; the owner name already is).
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/agency-orchestrator
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
      - id: meta-jvm
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/agency-orchestrator-jvm-agent
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build API image (local)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: scan/api:${{ github.sha }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/api:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build Java agent image (local)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: agents/jvm-specialist
          load: true
          push: false
          provenance: false
          tags: scan/jvm-agent:${{ github.sha }}
          build-args: VERSION=${{ steps.meta-jvm.outputs.version }}
          cache-from: type=gha,scope=jvm-agent
          cache-to: type=gha,mode=max,scope=jvm-agent
      - name: Scan Java agent image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/jvm-agent:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Only reached when both scans passed.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push API image
        id: push-api
        if: env.PUSH == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: true
          sbom: true
          cache-from: type=gha
      - name: Push Java agent image
        id: push-jvm
        if: env.PUSH == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: agents/jvm-specialist
          push: true
          tags: ${{ steps.meta-jvm.outputs.tags }}
          labels: ${{ steps.meta-jvm.outputs.labels }}
          build-args: VERSION=${{ steps.meta-jvm.outputs.version }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=jvm-agent

      # Sign by DIGEST (a tag can be moved; a digest cannot), keyless: the signature is
      # bound to this workflow's identity and logged in the public Rekor transparency log.
      # The cluster (or `cosign verify` in deploy.yml) accepts only images signed this way.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUSH == 'true'
      - name: Sign images
        if: env.PUSH == 'true'
        env:
          API: ghcr.io/${{ github.repository_owner }}/agency-orchestrator@${{ steps.push-api.outputs.digest }}
          JVM: ghcr.io/${{ github.repository_owner }}/agency-orchestrator-jvm-agent@${{ steps.push-jvm.outputs.digest }}
        run: |
          cosign sign --yes "$API"
          cosign sign --yes "$JVM"
          cosign verify "$API"             --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/ci.yml@"             --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
