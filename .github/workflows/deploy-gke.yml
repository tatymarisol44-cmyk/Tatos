name: Deploy to GKE

# One environment (staging or production), called by deploy.yml. Skipped, green, while
# the environment has no GKE variables (the cloud is not set up yet).
#
# Supply chain (decisions O4 and O6): verify the CI signature -> copy every image by digest
# into the project's Artifact Registry (the cluster pulls with its own identity, in the
# data's region, no registry password) -> attest those digests with the KMS key of the
# Binary Authorization attestor -> deploy. The cluster admits only attested images, so a
# manual `kubectl set image` with anything else is refused at admission.
on:
  workflow_call:
    inputs:
      environment: {type: string, required: true}
      image: {type: string, required: true, description: "ghcr.io/...@sha256:..."}
      jvm_image: {type: string, required: true, description: "ghcr.io/...-jvm-agent@sha256:..."}
      ref: {type: string, required: true, description: "Commit whose manifests to apply"}

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # production: required reviewers approve here
    timeout-minutes: 30
    env:
      CONFIGURED: ${{ vars.GKE_CLUSTER != '' && vars.GCP_WIF_PROVIDER != '' }}
    steps:
      - name: Environment not configured yet
        if: env.CONFIGURED != 'true'
        run: echo "::notice::${{ inputs.environment }} has no GKE variables; nothing deployed"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.CONFIGURED == 'true'
        with:
          ref: ${{ inputs.ref }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.CONFIGURED == 'true'
      # Only images this repository's CI built and signed may reach a cluster.
      - name: Verify the image signatures
        if: env.CONFIGURED == 'true'
        env:
          API: ${{ inputs.image }}
          JVM: ${{ inputs.jvm_image }}
          IDENTITY: ^https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main$
        run: |
          for image in "$API" "$JVM"; do
            cosign verify "$image" --certificate-identity-regexp "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          done
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: env.CONFIGURED == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: env.CONFIGURED == 'true'
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        if: env.CONFIGURED == 'true'
        with:
          version: v0.22.1
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        if: env.CONFIGURED == 'true'
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT }}
      # `crane copy` copies the manifest bytes, so the digest (what was signed, scanned and
      # rehearsed) is the same in Artifact Registry. Third-party images are taken from the
      # digests pinned in git, never from a tag.
      - name: Mirror every image into Artifact Registry
        id: mirror
        if: env.CONFIGURED == 'true'
        env:
          API: ${{ inputs.image }}
          JVM: ${{ inputs.jvm_image }}
          AR: ${{ vars.AR_REPOSITORY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          crane auth login ghcr.io -u "$GHCR_USER" --password-stdin <<< "$GHCR_TOKEN"
          gcloud auth configure-docker "${AR%%/*}" --quiet
          pinned() {  # the digest-pinned reference of a third-party image in the manifests
            kustomize build deploy/k8s/overlays/gke \
              | grep -oE "image: $1:[^ ]+@sha256:[0-9a-f]{64}" | head -1 | cut -d' ' -f2
          }
          mirror() {  # <source@sha256:...> <name in Artifact Registry> <output key>
            local digest="${1##*@}"
            case "$digest" in sha256:*) ;; *) echo "::error::$1 is not pinned by digest"; exit 1 ;; esac
            crane copy "$1" "$AR/$2:${digest#sha256:}"
            echo "$3=$AR/$2@$digest" >> "$GITHUB_OUTPUT"
          }
          mirror "$API" agency-orchestrator api
          mirror "$JVM" agency-orchestrator-jvm-agent jvm
          mirror "$(pinned qdrant/qdrant)" qdrant qdrant
          mirror "$(pinned redis)" redis redis
      - name: Attest the mirrored digests (Binary Authorization)
        if: env.CONFIGURED == 'true'
        env:
          ATTESTOR: ${{ vars.BINAUTHZ_ATTESTOR }}
          KEY_VERSION: ${{ vars.BINAUTHZ_KEY_VERSION }}
          IMAGES: >-
            ${{ steps.mirror.outputs.api }} ${{ steps.mirror.outputs.jvm }}
            ${{ steps.mirror.outputs.qdrant }} ${{ steps.mirror.outputs.redis }}
        run: |
          for image in $IMAGES; do
            existing=$(gcloud container binauthz attestations list --attestor="$ATTESTOR" \
              --artifact-url="$image" --format='value(name)')
            if [ -z "$existing" ]; then
              gcloud container binauthz attestations sign-and-create --artifact-url="$image" \
                --attestor="$ATTESTOR" --keyversion="$KEY_VERSION"
            fi
          done
      - name: Apply the manifests of this commit, then the health-gated rollout
        if: env.CONFIGURED == 'true'
        env:
          API: ${{ steps.mirror.outputs.api }}
          JVM: ${{ steps.mirror.outputs.jvm }}
          QDRANT: ${{ steps.mirror.outputs.qdrant }}
          REDIS: ${{ steps.mirror.outputs.redis }}
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: |
          # Manifest changes (config, policies, rules) ship with the code that needs them.
          # The API image stays the running one here; rollout.sh moves it, gated and
          # reversible.
          current=$(kubectl -n agency get deploy/agency-orchestrator \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          (cd deploy/k8s/overlays/gke && kustomize edit set image \
            "agency-orchestrator=${current:-$API}" "jvm-agent=$JVM" \
            "qdrant/qdrant=$QDRANT" "redis=$REDIS")
          kubectl apply -k deploy/k8s/overlays/gke
          bash deploy/scripts/rollout.sh agency "$API" 600s
