# Single-node Qdrant for small deployments. For HA use the official Helm chart
# (distributed mode) or Qdrant Cloud and point QDRANT_URL at it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  labels: {app.kubernetes.io/name: qdrant}
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: qdrant}
  template:
    metadata:
      labels: {app.kubernetes.io/name: qdrant}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.13.4
          ports: [{name: http, containerPort: 6333}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /qdrant/storage}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  selector: {app.kubernetes.io/name: qdrant}
  ports: [{name: http, port: 6333, targetPort: http}]
