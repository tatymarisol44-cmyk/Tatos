# Single-node Qdrant for small deployments. For HA use the official Helm chart
# (distributed mode) or Qdrant Cloud and point QDRANT_URL at it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  labels: {app.kubernetes.io/name: qdrant}
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: qdrant}
  template:
    metadata:
      labels: {app.kubernetes.io/name: qdrant}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
          ports: [{name: http, containerPort: 6333}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          # Read-only root, as Qdrant's official Helm chart does: it writes only to its
          # storage, snapshots and the init marker, so those (and /tmp) are writable mounts.
          env:
            - {name: QDRANT_INIT_FILE_PATH, value: /qdrant/init/.qdrant-initialized}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /qdrant/storage}
            - {name: snapshots, mountPath: /qdrant/snapshots}
            - {name: init, mountPath: /qdrant/init}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: snapshots, emptyDir: {}}
        - {name: init, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  selector: {app.kubernetes.io/name: qdrant}
  ports: [{name: http, port: 6333, targetPort: http}]
