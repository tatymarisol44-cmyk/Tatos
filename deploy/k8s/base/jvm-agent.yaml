# Java A2A specialist (agents/jvm-specialist). The orchestrator discovers it through
# REMOTE_AGENTS in its ConfigMap. One replica: its LLM-mode conversation memory is
# in-process (see ADR 0007); the rule-based mode is stateless and can scale out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jvm-agent
  labels: {app.kubernetes.io/name: jvm-agent}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: jvm-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: jvm-agent}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: jvm-agent
          ports: [{name: http, containerPort: 8080}]
          env:
            # Card URL must match the address the orchestrator uses (same-origin check).
            - {name: AGENT_PUBLIC_URL, value: "http://jvm-agent:8080"}
            - {name: AGENT_LLM_PROVIDER, value: "none"}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 20
          startupProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            failureThreshold: 30
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: jvm-agent
spec:
  selector: {app.kubernetes.io/name: jvm-agent}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# Only the orchestrator may call the agent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jvm-agent-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: jvm-agent}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: agency-orchestrator}
      ports: [{port: 8080}]
