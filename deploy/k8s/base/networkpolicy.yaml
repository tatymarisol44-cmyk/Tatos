# Zero-trust networking for the namespace: everything is denied, then each pod gets
# only the connections it needs. Policies are additive (a connection is allowed if any
# policy allows it). The jvm-agent ingress rule lives next to it in jvm-agent.yaml.
# Kubelet probes are node traffic and are not affected by these rules in common CNIs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Every pod may resolve names (cluster DNS) and nothing else by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
# The API is the only entry point (ingress controller, Prometheus scrape of /metrics).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: agency-orchestrator}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8000}]
---
# What the API may call: its in-cluster dependencies, the OTel collector, managed
# Postgres, and HTTPS for the LLM providers, Telegram, Meta, TikTok and Google Cloud
# Storage. Cloud metadata endpoints are excluded so a compromised pod cannot read node
# credentials. Keyless Google credentials on GKE are served from there, so the `gke`
# overlay opens exactly the GKE metadata server to the API pods only (owner's decision A8).
# For tighter control, replace 0.0.0.0/0 with your Postgres CIDR and route 443 through an
# egress gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: agency-orchestrator}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: qdrant}
      ports: [{port: 6333}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: redis}
      ports: [{port: 6379}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: jvm-agent}
      ports: [{port: 8080}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports: [{port: 4318}]
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32, 169.254.170.2/32]
      ports: [{port: 443}, {port: 5432}]
---
# Qdrant only accepts traffic from the API pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: qdrant}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: agency-orchestrator}
      ports: [{port: 6333}]
---
# Redis (rate-limit buckets) only accepts traffic from the API pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: redis}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: agency-orchestrator}
      ports: [{port: 6379}]
---
# The Java agent needs HTTPS only when AGENT_LLM_PROVIDER calls an LLM; rule-based mode
# makes no outbound calls at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jvm-agent-egress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: jvm-agent}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32, 169.254.170.2/32]
      ports: [{port: 443}]
