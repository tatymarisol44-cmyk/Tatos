apiVersion: v1
kind: Service
metadata:
  name: agency-orchestrator
spec:
  selector: {app.kubernetes.io/name: agency-orchestrator}
  ports: [{name: http, port: 80, targetPort: http}]
  # Conversation checkpoints are in-process for now (see README "Known limitations"),
  # so pin clients to a replica until a shared checkpointer is configured.
  sessionAffinity: ClientIP
