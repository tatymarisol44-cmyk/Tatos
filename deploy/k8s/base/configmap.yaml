apiVersion: v1
kind: ConfigMap
metadata:
  name: agency-orchestrator-config
data:
  APP_ENV: prod
  LLM_BACKEND: litellm
  LLM_MODEL: anthropic/claude-sonnet-5-5
  ROUTER_MODEL: anthropic/claude-haiku-4-5-20251001
  EMBEDDING_BACKEND: litellm
  EMBEDDING_MODEL: openai/text-embedding-3-small
  VECTOR_BACKEND: qdrant
  QDRANT_URL: http://qdrant:6333
  # POSTGRES_URL (checkpoints) and DATABASE_URL (audit, reviews, consents, CRM,
  # campaigns) come from the secret (managed Postgres: RDS, Cloud SQL, Azure DB...).
  CHECKPOINTER_BACKEND: postgres
  # Industry packs per tenant (JSON), e.g. {"clinica-sonrisa": "dental"}.
  TENANT_PACKS: '{}'
  DEFAULT_PACK: general
  # Remote A2A specialists (JSON list of base URLs).
  REMOTE_AGENTS: '["http://jvm-agent:8080"]'
  # Prometheus pull on a pod-internal port (docs/slo.md); traces/metrics push over OTLP
  # only where a collector runs (the gke overlay turns OTLP off: Managed Prometheus scrapes).
  METRICS_PORT: "9464"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  RATE_LIMIT_PER_MINUTE: "60"
  # One bucket per tenant shared by all replicas (the HPA runs 2+). In-cluster Redis has
  # no credentials; the NetworkPolicy lets only the API pods reach it.
  RATE_LIMIT_BACKEND: redis
  REDIS_URL: redis://redis:6379/0
  # If Redis is down: each replica falls back to its own bucket (no outage, bounded spend).
  RATE_LIMIT_ON_OUTAGE: local
  # Use the pricing map bundled with the pinned LiteLLM instead of fetching it at startup.
  LITELLM_LOCAL_MODEL_COST_MAP: "True"
  # Rendered creatives (ADR 0015). The root filesystem is read-only: only /tmp is writable.
  # With GCS_BUCKET set this is just a per-pod cache; the bucket is the source of truth.
  MEDIA_DIR: /tmp/media
  # GCS_BUCKET: creativos-<practice>   # set once the bucket exists (owner's decision A3)
  MEDIA_URL_TTL_MINUTES: "60"
