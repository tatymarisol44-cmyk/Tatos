# Throwaway Postgres for the deploy rehearsal only. Production uses a managed database
# (RDS, Cloud SQL, Azure Database...) reached through DATABASE_URL in the secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres}
    spec:
      automountServiceAccountToken: false
      # The namespace enforces the restricted Pod Security profile: run as the image's
      # postgres user (uid 70 in the Alpine image), no privilege escalation.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          env:
            - {name: POSTGRES_USER, value: agency}
            - {name: POSTGRES_PASSWORD, value: agency}
            - {name: POSTGRES_DB, value: agency}
            # The emptyDir mount point is owned by root and uid 70 cannot chmod it, so
            # initdb would crash-loop. A subdirectory is created, and owned, by Postgres.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: pg, containerPort: 5432}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "agency", "-d", "agency"]}
            periodSeconds: 3
          # Read-only root: Postgres writes only its data, its socket directory and /tmp.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: pg, port: 5432, targetPort: pg}]
---
# The namespace denies everything by default (base/networkpolicy.yaml). The base lets the
# API reach a MANAGED Postgres by IP range, which does not describe a pod; this in-cluster
# Postgres needs its own pair of rules, or the migrate init container never connects and
# the first deploy never becomes Ready.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: agency-orchestrator}
      ports: [{port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress-postgres
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: agency-orchestrator}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: postgres}
      ports: [{port: 5432}]
