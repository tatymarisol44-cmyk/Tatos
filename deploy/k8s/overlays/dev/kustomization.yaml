apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: HorizontalPodAutoscaler, name: agency-orchestrator}
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target: {kind: ConfigMap, name: agency-orchestrator-config}
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: dev
