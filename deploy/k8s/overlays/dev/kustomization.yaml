apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: HorizontalPodAutoscaler, name: agency-orchestrator}
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target: {kind: ConfigMap, name: agency-orchestrator-config}
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: dev
      # No database in the dev cluster: in-memory threads (Service affinity keeps them);
      # without DATABASE_URL the governance/CRM tables live in per-pod SQLite memory too.
      - op: replace
        path: /data/CHECKPOINTER_BACKEND
        value: memory
  # ...which is why dev, unlike prod, pins each client to one pod.
  - target: {kind: Service, name: agency-orchestrator}
    patch: |-
      - op: add
        path: /spec/sessionAffinity
        value: ClientIP
