# The API's own identity. With Workload Identity Federation for GKE, IAM grants are made to
# this ServiceAccount directly (principal://.../subject/ns/agency/sa/agency-orchestrator);
# no Google key exists anywhere. The Kubernetes API token is not mounted: the pods never
# call the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agency-orchestrator
automountServiceAccountToken: false
