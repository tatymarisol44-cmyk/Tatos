[project]
name = "agency-orchestrator"
version = "0.1.0"
description = "Multi-agent orchestrator that routes each question to the right specialist from The Agency catalog."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Taty Santillan" }]
dependencies = [
    # Security floor for the HTTP transport used by LiteLLM.
    "aiohttp>=3.14.4",
    # Keep the patched certificate bundle and transitive file lock when resolving.
    "certifi>=2026.10.19",
    "filelock>=4.2.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    # Patched v3 streaming path handling (CVE-2026-118667).
    "langgraph>=1.2.14",
    "langgraph-sdk>=0.4.6",
    "litellm>=1.50",
    "qdrant-client>=1.12",
    "mcp>=2.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "langgraph-checkpoint-postgres>=3.1.3",
    "psycopg[binary,pool]>=3.3.6",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pillow>=13",
    "google-cloud-storage>=2.18",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "pyjwt[crypto]>=2.10",
    "cryptography>=46",
    "segno>=1.6",
]

[project.scripts]
agency = "orchestrator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
    "fakeredis[lua]>=2.26",
    # Browser test of the console (tests/test_console_e2e.py); browsers are installed
    # separately: `uv run playwright install chromium`.
    "playwright>=1.48",
]
load = [
    "locust>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",   # asserts are fine in tests
    "SIM905", # word lists read better as a split string
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=orchestrator --cov-report=term-missing --cov-fail-under=80"
filterwarnings = [
    # Embedded Qdrant (tests only) ignores payload indexes; the server honours them.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
