[project]
name = "agency-orchestrator"
version = "0.1.0"
description = "Multi-agent orchestrator that routes each question to the right specialist from The Agency catalog."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Taty Santillan" }]
dependencies = [
    # Security floor for the HTTP transport used by LiteLLM.
    "aiohttp>=3.14.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "langgraph>=0.2.60",
    "litellm>=1.50",
    "qdrant-client>=1.12",
    "mcp>=2.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pillow>=11",
    "google-cloud-storage>=2.18",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "pyjwt[crypto]>=2.10",
    "cryptography>=46",
    "segno>=1.6",
]

[project.scripts]
agency = "orchestrator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
    "fakeredis[lua]>=2.26",
    # Browser test of the console (tests/test_console_e2e.py); browsers are installed
    # separately: `uv run playwright install chromium`.
    "playwright>=1.48",
]
load = [
    "locust>=2.32",
]

[build-system]
# Each universal wheel is pinned by URL and SHA-256, including transitive build tools.
requires = [
    "hatchling @ https://files.pythonhosted.org/packages/5f/80/91f51f439c05d4ec4623c22928ce16a938d6d793bf709477830823497859/hatchling-1.32.4-py3-none-any.whl#sha256=08ecf7548fb48205e7f213d70c71e67b8271b7242093dc3f1da578b42c734a2c",
    "packaging @ https://files.pythonhosted.org/packages/63/34/ba1c580383c9eada3711951fef0795c80b829a078d72188184bcab9dd527/packaging-26.3-py3-none-any.whl#sha256=d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c",
    "pathspec @ https://files.pythonhosted.org/packages/f1/d9/7fb5aa316bc299258e68c73ba3bddbc499654a07f151cba08f6153988714/pathspec-1.1.1-py3-none-any.whl#sha256=a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189",
    "pluggy @ https://files.pythonhosted.org/packages/40/9e/2b38731e0fc536806f16490e1a12d7f0dc2a1235aa8cc07bcc75416a7daa/pluggy-1.7.0-py3-none-any.whl#sha256=7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec",
    "tomlkit @ https://files.pythonhosted.org/packages/da/46/7d84138a60a8bd796825b2d38ebe92d0d16501ca57d501b7c5d677401bbc/tomlkit-0.15.2-py3-none-any.whl#sha256=05562412163a3037b94497385fb7f9204c637bc605af7a48199e41cf2272f437",
    "trove-classifiers @ https://files.pythonhosted.org/packages/30/81/0da8afb52a71d0a4f2bd3152357b1a441e393b286374802b9d3addab4ab5/trove_classifiers-2026.9.21.13-py3-none-any.whl#sha256=8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",   # asserts are fine in tests
    "SIM905", # word lists read better as a split string
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=orchestrator --cov-report=term-missing --cov-fail-under=80"
filterwarnings = [
    # Embedded Qdrant (tests only) ignores payload indexes; the server honours them.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
